# Barullín: ajustes de compilación (base/tools/build.py app)
name = "BARULLIN"
id_prefix = "FM-1_47"          # identidad del paquete (propia de Barullín)
usb_manufacturer = "Barullo"
usb_product = "BARULLIN FM-1"
o2 = ["core/chords.c"]         # el motor de acordes, unidad aparte a -O2
words = "words.tsv"
font_full = ["L"]              # minúsculas en la fuente grande: "Am7", "Bbmaj7", "sus4"
ble = true                     # MIDI por Bluetooth (para el directo)
ble_stack = "own"              # la pila Bluetooth propia de fm1-base: nada de las librerías de JieLi
bt_audio = true                # el sonido a cascos y altavoces Bluetooth (A2DP): para escuchar (150-300 ms de retraso)
bt_audio_sim = true            # (el simulador y el emulador con su sustituto)
# la web (tools/make_site.py)
tagline = "acordes de bolsillo"
repo = "https://github.com/callejodev-dotcom/barullin"
licence = "AGPL-3.0"
credits = "Built on fm1-base by Charles Vestal (MPL-2.0)."
author = "callejodev"
description = "A HiChord-style chord instrument for the FM-1: seven keys play the chords of a key and mode, the black keys change them (minor, 7, maj7, sus, 9, 6, dim/aug, inversions), the rest of the white keys strum them, with smooth voice leading."
tags = ["synth"]
